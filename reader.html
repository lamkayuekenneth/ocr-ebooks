<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>閱讀器 · OCR eBooks</title>
<style>
:root {
  --paper: #f6efe1;
  --paper2: #efe4cd;
  --ink: #3d3326;
  --muted: #8a7b63;
  --accent: #a8622a;
  --mark: #ffd54f;
  --mark-act: #ffb300;
  --line: #ddd0b2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, 'Times New Roman', serif;
}
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--paper2); border-bottom: 1px solid var(--line);
  padding: 8px 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
}
/* 行 1：書名 + font 調整（A−/A+ 喺書名最右邊同一行） */
.row1 { display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; }
.book-title {
  font-size: 18px; font-weight: 800; letter-spacing: .5px;
  margin-right: auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ctl { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
/* 行 2：搜尋相關全部同一行 */
.row2 { display: flex; align-items: center; width: 100%; min-width: 0; }
.search-wrap { display: flex; align-items: center; gap: 5px; width: 100%; min-width: 0; }
.btn {
  font-family: inherit; font-size: 14px;
  background: #fff; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; cursor: pointer;
}
.btn:hover { background: #fdf8ee; }
.btn:disabled { opacity: .4; cursor: default; }
#font-pct { font-size: 12px; color: var(--muted); min-width: 44px; text-align: center; }
#search {
  font-family: inherit; font-size: 14px;
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; flex: 1 1 auto; min-width: 0; background: #fff;
}
#count {
  font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 52px; text-align: center;
  align-self: center; line-height: 1;
}
.arrow { padding: 6px 9px; font-size: 13px; }
.focus-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Focus：專注一句——目標句玻璃面板（半透明白 + 光邊 + 陰影，唔會 blur 其他字），其他字保持正常色 */
body.focus-mode #focus-sentence {
  color: #111;
  background: linear-gradient(135deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .55));
  border: 1px solid rgba(255, 255, 255, .95);
  border-radius: 8px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, .14), inset 0 1px 3px rgba(255, 255, 255, 1);
  padding: 1px 4px;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
/* 浮動句子導航（畫面右邊中間，半透明） */
.focus-floating {
  position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
  z-index: 30; display: none; flex-direction: column; gap: 10px;
  opacity: .55;
}
body.focus-mode .focus-floating { display: flex; }
.focus-floating .btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255, 255, 255, .65);
  border: 1px solid rgba(0, 0, 0, .18);
  color: var(--ink, #3d3326);
  font-size: 15px; padding: 0; line-height: 1;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
}
/* 遮罩高過 main，但低過 chapters / header（保持導航可用） */
.chapters { z-index: 10; }
.chapters {
  position: sticky; z-index: 15;          /* top 由 JS 按 header 實際高度設定，desktop/mobile 都浮頂 */
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding: 8px 14px;
  display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
}
.chip {
  font-family: inherit; font-size: 13px;
  border: 1px solid var(--line); border-radius: 999px;
  background: #fdf9f0; color: var(--accent);
  padding: 4px 14px; cursor: pointer; flex: 0 0 auto;
}
.chip:hover { background: #f7ead6; }
main {
  width: 100%;
  padding: 30px 24px 90px;
  font-size: 19px; line-height: 1.9;
}
.section { margin-bottom: 2px; }
.section .topic {
  font-size: 1.35em; font-weight: 800; letter-spacing: .5px;
  margin: .3em 0 .45em; color: var(--ink);
  line-height: 1.4;
}
.section .topic.no-tag { margin-top: 1.6em; }   /* chapter 冇變 → 冇 tag，topic 前留空行分隔 */
.chapter-tag {
  display: inline-block;
  font-size: .75em; font-weight: 600; color: var(--accent);
  background: #f3e8d2; border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 12px;
  margin: 1.4em 0 0;
}
.section .content {
  text-align: justify; text-justify: inter-ideograph;
  white-space: pre-wrap;           /* 保留 \n\n 段落分隔 */
  word-break: break-word;
}
.section .content + .content { margin-top: 0; }   /* 同 topic 多頁完全無縫：行之間冇空行 */
.section .content:empty::after { content: '（內容從缺）'; color: var(--muted); font-style: italic; }
mark { background: var(--mark); color: #5d4037; padding: 0 2px; border-radius: 2px; }
mark.active { background: var(--mark-act); outline: 2px solid #b07d00; }
.empty {
  text-align: center; color: var(--muted);
  padding: 60px 20px; font-size: 17px;
}
.err { text-align: center; color: #b3261e; padding: 60px 20px; font-size: 16px; line-height: 1.7; }
footer {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--paper2); border-top: 1px solid var(--line);
  text-align: center; font-size: 12px; color: var(--muted);
  padding: 6px;
}
@media (max-width: 640px) {
  header { padding: 6px 10px; gap: 5px 8px; }
  .book-title { font-size: 15px; }
  .btn { padding: 5px 8px; font-size: 13px; }
  #search { font-size: 13px; padding: 5px 8px; }
  main { padding: 18px 14px 70px; }
  .chapters { padding: 6px 10px; }
}
</style>
</head>
<body>

<header>
  <div class="row1">
    <div class="book-title" id="book-title">⋯</div>
    <div class="ctl">
      <button class="btn arrow" id="btn-focus-prev" title="上一句（↑）">▲</button>
      <button class="btn arrow" id="btn-focus-next" title="下一句（↓）">▼</button>
      <button class="btn focus-btn" id="btn-focus" title="專注模式：突出當前句">專注</button>
      <button class="btn" id="font-down" title="縮細字體">A−</button>
      <span id="font-pct">100%</span>
      <button class="btn" id="font-up" title="放大字體">A+</button>
    </div>
  </div>
  <div class="row2">
    <div class="search-wrap">
      <input id="search" type="text" placeholder="🔍 搜尋全文…" autocomplete="off">
      <span id="count"></span>
      <button class="btn arrow" id="prev" title="上一個匹配">▲</button>
      <button class="btn arrow" id="next" title="下一個匹配">▼</button>
      <button class="btn" id="close" title="關閉">✕</button>
    </div>
  </div>
</header>

<div class="chapters" id="chapters"></div>

<!-- 浮動句子導航（畫面右邊中間） -->
<div class="focus-floating" id="focus-floating">
  <button class="btn" id="float-focus-prev" title="上一句">▲</button>
  <button class="btn" id="float-focus-next" title="下一句">▼</button>
</div>

<main id="book"></main>
<footer>OCR eBooks 閱讀器 · 字體縮放會自動記低</footer>

<!-- Focus：目標句用 span 標記（其餘文字 color 淡化，唔需要遮罩層） -->

<script>
(function () {
  const $ = (sel) => document.querySelector(sel);

  const params = new URLSearchParams(location.search);
  const file = params.get('file') || '';
  let settings = {};
  try { settings = JSON.parse(localStorage.getItem('ocreb_settings') || '{}'); } catch (e) { /* ignore */ }
  const owner = settings.github_owner || 'lamkayuekenneth';
  const repo  = settings.github_repo  || 'ocr-ebooks';
  const branch = settings.github_branch || 'main';
  const token = settings.github_token || '';

  let rows = [];
  let fontScale = parseFloat(localStorage.getItem('ocr_reader_font') || '1');
  if (!(fontScale >= 0.6 && fontScale <= 2)) fontScale = 1;
  let searchQ = '';
  let matches = [];
  let matchIdx = -1;

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function hl(text, q) {
    const s = String(text ?? '');
    if (!q) return esc(s);
    const low = s.toLowerCase(), ql = q.toLowerCase();
    if (!low.includes(ql)) return esc(s);
    let out = '', i = 0;
    while (true) {
      const j = low.indexOf(ql, i);
      if (j < 0) { out += esc(s.slice(i)); break; }
      out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + ql.length)) + '</mark>';
      i = j + ql.length;
    }
    return out;
  }
  function pageSortKey(p) {
    const s = String(p || '').trim();
    const m = /(\d+)([a-zA-Z\u3400-\u9fff]?)/.exec(s);
    if (!m) return [Infinity, Infinity, s];
    return [parseInt(m[1], 10) || 0, m[2] ? 1 : 0, String(m[2] || '').toLowerCase()];
  }

  async function load() {
    const t = $('#book-title');
    t.textContent = file.replace(/^books\//, '').replace(/\.json$/, '');
    if (!file) { $('#book').innerHTML = '<div class="err">❌ 冇指定書檔（缺少 ?file= 參數）</div>'; return; }
    try {
      const headers = { 'Accept': 'application/vnd.github+json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const url = 'https://api.github.com/repos/' + encodeURIComponent(owner) + '/' + encodeURIComponent(repo) +
                  '/contents/' + encodeURIComponent(file) + '?ref=' + encodeURIComponent(branch);
      const res = await fetch(url, { headers });
      if (!res.ok) throw new Error('HTTP ' + res.status + '（檢查設定頁嘅 GitHub 資料）');
      const data = await res.json();
      /* GitHub 可能回傳 base64 wrapper（無 raw header 時）：自己解碼，確保任何環境都一致 */
      let book = data;
      if (data && data.encoding === 'base64' && data.content) {
        const bin = atob(data.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        book = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      }
      if (book.book_title) t.textContent = book.book_title;
      document.title = (book.book_title || t.textContent) + ' · OCR eBooks';
      rows = (Array.isArray(book.rows) ? book.rows : [])
        .filter(r => r.topic && r.topic.trim())   /* 冇 topic 嘅 row 唔顯示 */
        .map(r => ({ topic: (r.topic || '').trim(), content: (r.content || '').trim(), chapter: (r.chapter || '').trim(), page: (r.page || '').trim() }))
        .sort((a, b) => {
          const ka = pageSortKey(a.page), kb = pageSortKey(b.page);
          return ka[0] - kb[0] || ka[1] - kb[1] || ka[2].localeCompare(kb[2]);
        });
      buildChapters();
      render();
    } catch (e) {
      $('#book').innerHTML = '<div class="err">❌ 讀取失敗：' + esc(e.message) + '<br><br><a href="index.html" style="color:var(--accent)">返回主頁</a></div>';
    }
  }

  function buildChapters() {
    const seen = new Set();
    rows.forEach(r => { const c = r.chapter; if (c && !seen.has(c)) seen.add(c); });
    const list = Array.from(seen);
    const wrap = $('#chapters');
    wrap.innerHTML = '';
    if (!list.length) { wrap.style.display = 'none'; return; }
    wrap.style.display = 'flex';
    list.forEach(c => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = c;
      chip.title = '跳到「' + c + '」';
      chip.onclick = () => {
        const el = document.querySelector('.section[data-chapter="' + CSS.escape(c) + '"]');
        if (el) {
          /* 減返 sticky header + chapter 導航列高度，避免遮住章節開頭 */
          const offset = document.querySelector('header').getBoundingClientRect().height +
                         document.querySelector('.chapters').getBoundingClientRect().height + 8;
          const top = el.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
      };
      wrap.appendChild(chip);
    });
  }

  function render() {
    const main = $('#book');
    main.style.fontSize = (19 * fontScale) + 'px';
    main.innerHTML = '';
    if (!rows.length) {
      main.innerHTML = '<div class="empty">呢本書未有內容。</div>';
      updateCount();
      return;
    }
    let lastChapter = null, lastTopic = null, curSec = null;
    rows.forEach(r => {
      /* chapter 或 topic 改變 → 開新 section；topic 同上一行一樣就唔重複標題，內容直接接落去 */
      if (r.chapter !== lastChapter || r.topic !== lastTopic) {
        const chapterChanged = r.chapter !== lastChapter;
        curSec = document.createElement('div');
        curSec.className = 'section';
        if (r.chapter) curSec.dataset.chapter = r.chapter;
        /* chapter 標示：只有 chapter 同上一 row 唔同先至顯示（唔重複） */
        if (chapterChanged && r.chapter) {
          const tag = document.createElement('div');
          tag.className = 'chapter-tag';
          tag.textContent = r.chapter;
          curSec.appendChild(tag);
        }
        if (r.topic !== lastTopic) {
          const topic = document.createElement('div');
          topic.className = 'topic';
          if (!chapterChanged) topic.classList.add('no-tag');   /* 冇 chapter tag → topic 前加空行分隔 */
          topic.innerHTML = searchQ ? hl(r.topic, searchQ) : esc(r.topic || '');
          curSec.appendChild(topic);
        }
        main.appendChild(curSec);
        lastChapter = r.chapter;
        lastTopic = r.topic;
      }
      let ctext = r.content || '';
      if (curSec.childElementCount > 0) ctext = ctext.replace(/^\n+/, '');   /* 行間無縫：合併行唔留開頭空行 */
      const content = document.createElement('div');
      content.className = 'content';
      content.innerHTML = searchQ ? hl(ctext, searchQ) : esc(ctext);
      curSec.appendChild(content);
    });
    updateCount();
  }

  function updateCount() {
    matches = Array.from(document.querySelectorAll('#book mark'));
    if (searchQ) {
      $('#count').textContent = matches.length ? '匹配 ' + (matchIdx + 1) + ' / ' + matches.length : '0 個匹配';
      $('#prev').disabled = !matches.length;
      $('#next').disabled = !matches.length;
      if (!matches.length) matchIdx = -1;
    } else {
      $('#count').textContent = '';
      $('#prev').disabled = true;
      $('#next').disabled = true;
      matchIdx = -1;
    }
  }

  function scrollToMatch() {
    if (!matches.length) return;
    if (matchIdx < 0 || matchIdx >= matches.length) matchIdx = 0;
    const m = matches[matchIdx];
    matches.forEach(x => x.classList.remove('active'));
    m.classList.add('active');
    $('#count').textContent = '匹配 ' + (matchIdx + 1) + ' / ' + matches.length;
    m.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  $('#search').addEventListener('input', () => {
    searchQ = $('#search').value.trim().toLowerCase();
    matchIdx = -1;
    render();
    if (matches.length) { matchIdx = 0; scrollToMatch(); }
  });
  $('#prev').addEventListener('click', () => {
    if (!matches.length) return;
    matchIdx = (matchIdx - 1 + matches.length) % matches.length;
    scrollToMatch();
  });
  $('#next').addEventListener('click', () => {
    if (!matches.length) return;
    matchIdx = (matchIdx + 1) % matches.length;
    scrollToMatch();
  });

  function applyFont() {
    fontScale = Math.min(2, Math.max(0.6, Math.round(fontScale * 10) / 10));
    localStorage.setItem('ocr_reader_font', String(fontScale));
    $('#font-pct').textContent = Math.round(fontScale * 100) + '%';
    $('#book').style.fontSize = (19 * fontScale) + 'px';
  }

  /* chapter 導航固定浮喺 header 之下（desktop / mobile 都準確） */
  function fixChaptersTop() {
    const h = document.querySelector('header').getBoundingClientRect().height;
    document.querySelector('.chapters').style.top = h + 'px';
  }
  window.addEventListener('resize', fixChaptersTop);
  $('#font-up').addEventListener('click', () => { fontScale += 0.1; applyFont(); });
  $('#font-down').addEventListener('click', () => { fontScale -= 0.1; applyFont(); });

  /* =========================================================
   * Focus line（Chrome Reader Mode 專注閱讀風格）
   * ========================================================= */
  const dim = null;
  let focusMode = false, sentences = [], focusIdx = 0;

  /* 句尾判斷：中英句尾標點都處理；英文 '.' 避開數字（3.14、Mr. 唔誤斷） */
  function isSentEnd(text, i) {
    const ch = text[i];
    if ('。！？…；'.includes(ch)) return true;
    if (ch === '!' || ch === '?') return true;
    if (ch === '.') {
      const nx = text[i + 1] || '';
      if (/\d/.test(nx) || /[A-Za-z]/.test(nx)) return false;   /* 3.14 / Mr. / www. */
      return true;                                              /* 空格／結尾 → 英文句尾 */
    }
    return false;
  }

  function addSentence(node, s, e) {
    const r = document.createRange();
    r.setStart(node, s); r.setEnd(node, e);
    let first = null, last = null;
    for (const rc of r.getClientRects()) {
      if (rc.width < 1 || rc.height < 1) continue;
      if (!first) first = rc;
      last = rc;
    }
    if (!first || !last) return;
    sentences.push({
      node, s, e,                 /* 儲存 text node + 字符範圍，每次重建 Range（live Range 會被 unwrap/normalize 破壞） */
      top: first.top + window.scrollY,
      bottom: last.bottom + window.scrollY,
      text: node.data.slice(s, e).trim().slice(0, 30)
    });
  }

  /* 逐字符拆句：每個 text node 內按句尾標點切成一整句一整句 */
  function collectSentences() {
    sentences = [];
    const walker = document.createTreeWalker($('#book'), NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const n = walker.currentNode;
      if (!n.data.trim()) continue;
      const pe = n.parentElement;
      if (pe && pe.closest('.chapter-tag')) continue;   /* 章節標籤唔算閱讀行 */
      const text = n.data;
      let s = 0;
      for (let i = 0; i < text.length; i++) {
        if (isSentEnd(text, i)) {
          addSentence(n, s, i + 1);
          s = i + 1;
          while (s < text.length && /\s/.test(text[s])) s++;   /* 跳過句尾後嘅 \n 空白，唔好黐住上一行 */
        }
      }
      if (s < text.length) addSentence(n, s, text.length);
    }
  }

  function sentenceIndexAtCenter() {
    const center = window.scrollY + window.innerHeight * 0.42;
    for (let i = 0; i < sentences.length; i++) {
      const s = sentences[i];
      if (center >= s.top && center <= s.bottom) return i;
    }
    let best = 0, bd = Infinity;
    sentences.forEach((s, i) => {
      const d = Math.abs((s.top + s.bottom) / 2 - center);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  /* 目標句用 <span id="focus-sentence"> 包起（surroundContents 會拆 text node，所以每次 apply 前重新掃描 DOM 取新鮮 node 引用） */
  function applyFocusSentence() {
    const old = $('#focus-sentence');
    if (old) {
      const p = old.parentNode;
      while (old.firstChild) p.insertBefore(old.firstChild, old);
      p.removeChild(old);
    }
    if (!focusMode) return;
    collectSentences();                                  /* 重新掃描（unwrap 後 DOM 乾淨，node 引用新鮮） */
    focusIdx = Math.min(focusIdx, sentences.length - 1);
    if (!sentences.length) return;
    const s = sentences[focusIdx];
    const r = document.createRange();
    r.setStart(s.node, s.s);
    r.setEnd(s.node, s.e);
    const span = document.createElement('span');
    span.id = 'focus-sentence';
    try { r.surroundContents(span); } catch (e) { /* 唔好打斷渲染 */ }
  }

  function updateFocusLine() {
    if (!sentences.length) return;
    focusIdx = sentenceIndexAtCenter();   /* 中心句 → 全書只有呢句清晰 */
    applyFocusSentence();
  }

  /* 上／下一句導航（按鈕 ▲▼ 或鍵盤 ↑↓） */
  let focusNavLock = false;
  function focusMove(d) {
    if (!focusMode || !sentences.length) return;
    focusIdx = Math.min(sentences.length - 1, Math.max(0, focusIdx + d));
    applyFocusSentence();
    const target = sentences[focusIdx].top - window.innerHeight * 0.42;
    focusNavLock = true;
    window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    setTimeout(() => { focusNavLock = false; }, 600);
  }

  let focusScrollTimer = null;
  function onFocusScroll() {
    if (focusNavLock) return;              /* 導航 smooth scroll 期間唔理 */
    clearTimeout(focusScrollTimer);
    focusScrollTimer = setTimeout(() => { updateFocusLine(); }, 300);   /* scroll 停低 300ms 先順住換句 */
  }

  function setFocusMode(on) {
    focusMode = on;
    document.body.classList.toggle('focus-mode', on);
    $('#btn-focus').classList.toggle('active', on);
    if (on) {
      collectSentences();
      updateFocusLine();
      window.addEventListener('scroll', onFocusScroll, { passive: true });
      window.addEventListener('resize', () => { collectSentences(); updateFocusLine(); });
    } else {
      const old = $('#focus-sentence');
      if (old) {
        const p = old.parentNode;
        while (old.firstChild) p.insertBefore(old.firstChild, old);
        p.removeChild(old);
        p.normalize();
      }
      window.removeEventListener('scroll', onFocusScroll);
    }
  }

  /* 點擊正文任何位置 → focus 移到該句（caret 定位 text node + 字符 offset） */
  function sentenceAtPoint(x, y) {
    if (!sentences.length) return -1;
    let range = null;
    if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
    else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (p) range = { startContainer: p.offsetNode, startOffset: p.offset };
    }
    if (!range || !range.startContainer || range.startContainer.nodeType !== 3) return -1;
    const node = range.startContainer;
    const off = range.startOffset;
    for (let i = 0; i < sentences.length; i++) {
      const s = sentences[i];
      if (s.node === node && off >= s.s && off <= s.e) return i;
    }
    return -1;
  }

  $('#book').addEventListener('click', e => {
    if (!focusMode) return;
    const i = sentenceAtPoint(e.clientX, e.clientY);
    if (i < 0) return;
    focusIdx = i;
    applyFocusSentence();
    const target = sentences[focusIdx].top - window.innerHeight * 0.42;
    focusNavLock = true;
    window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    setTimeout(() => { focusNavLock = false; }, 600);
  });

  $('#btn-focus').addEventListener('click', () => setFocusMode(!focusMode));
  $('#btn-focus-prev').addEventListener('click', () => focusMove(-1));
  $('#btn-focus-next').addEventListener('click', () => focusMove(1));
  $('#float-focus-prev').addEventListener('click', () => focusMove(-1));
  $('#float-focus-next').addEventListener('click', () => focusMove(1));
  $('#close').addEventListener('click', () => window.close());
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (window.opener) { window.close(); } return; }
    if (e.target === $('#search')) return;
    if (e.key === 'ArrowUp') { if (focusMode) { focusMove(-1); } else { $('#prev').click(); } return; }
    if (e.key === 'ArrowDown') { if (focusMode) { focusMove(1); } else { $('#next').click(); } return; }
    if (e.key === '+' || e.key === '=') { fontScale += 0.1; applyFont(); }
    if (e.key === '-') { fontScale -= 0.1; applyFont(); }
  });

  applyFont();
  fixChaptersTop();
  load();
})();
</script>
</body>
</html>
